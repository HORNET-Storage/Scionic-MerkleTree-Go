name: CI

# The checks that are run locally before a commit, on Linux, macOS and
# Windows: formatting, go vet, and the full test suite with the race detector
# on. The tests hold the library to the vectors under spec/, and to the
# forged bytes that it has to refuse.

on:
  push:
    branches: [main, hardening]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -count=1 -race -covermode=atomic -coverprofile=coverage.txt ./...
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  oldest:
    name: the oldest Go the module names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go version
      - run: go vet ./...
      - run: go test -count=1 ./...

  narrow:
    name: 32-bit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Sizes and counts are 64-bit in the format, whatever the machine. Here
      # the tests run where the machine's own numbers are 32-bit.
      - run: GOARCH=386 go vet ./...
      - run: GOARCH=386 go test -count=1 ./...
