name: Test & Coverage

# Built and tested on Linux, macOS and Windows, with the race detector on.
# The tests hold the library to the vectors under spec/ on each of them.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: 1.25.0

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test (with cross-package coverage)
      run: |
        go test ./... \
          -v \
          -race \
          -covermode=atomic \
          -coverpkg=./... \
          -coverprofile=coverage.txt

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v3
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
